<style>
body {
  margin: 0;
  padding: 0;
  animation: fadeAnimation 1.5s ease forwards;

@keyframes fadeAnimation {
  0% { opacity: 0; }
  100% { opacity: 1; }
}
#BGVideo {
  position: fixed;
  right: 0;
  bottom: 0;
  min-width: 100%;

}
nav {

ul {
  display: flex;
  justify-content: center;
  align-items: center;
  list-style-type: none;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background-color: rgba(0, 0, 0, 0.925);
  backdrop-filter: blur(100px);
  border-color: white;
  border-radius: 12px;
  padding: 5px;
  border-style: dotted;
}
ul li {
  float: left;
}
ul li a {
  display: block;
  color: white;
  text-align: center;
  padding: 30px 25px;
  text-decoration: none;
  margin: 5px;
}
ul li a {
  display: block;
  color: white;
  text-align: center;
  padding: 30px 25px;
  text-decoration: none;
  border: 1px solid transparent;
  border-radius: 8px;
  transition: 0.3s ease;
}

li a:hover {
  color: black;
  background-color: white;
  border: 1px solid white;
  transform: scale(1.1);
}

}
section0 section1,
section0 section2,
section0 section3,
section0 nav {

section0 section1 {

section0 section2 {

p.Welcome {

section0 section3 button {

  height: 25px;

  background-color: white;

section0 section3 button:hover {
